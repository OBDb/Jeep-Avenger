    description: "The Jeep Avenger is a subcompact crossover SUV (B-segment) produced by Jeep since January 2023 mainly for the European market. Based on the Common Modular Platform (CMP) shared with the second-generation Peugeot 2008, Opel Mokka, and DS 3 Crossback, it is the smallest vehicle offered by Jeep. At just 4.08 meters long, it's positioned below the Renegade in size. The Avenger is offered with mild hybrid and battery electric powertrains, using the STLA Small platform (e-CMP for the electric version). The battery electric version features a front-mounted electric motor producing 115 kW (154 HP) and 260 Nm of torque, paired with a 54 kWh battery providing up to 400 km (249 miles) of WLTP range. The mild hybrid variants use a 1.2L turbocharged three-cylinder engine with 48V mild hybrid technology. Ground clearance is 200mm with 20° approach angle and 32° departure angle, equipped with Jeep's Selec-Terrain system (Normal, Eco, Sport, Snow, Mud, Sand modes) and Hill Descent Control. The interior features a 10.25-inch touchscreen infotainment system and 10.25-inch digital instrument cluster. Designed in Italy and manufactured in Tychy, Poland, the Avenger is primarily marketed in Europe with sales also planned in Turkey, Morocco, Japan, and South Korea. It is not available in the United States, Canada, or China. The Avenger won European Car of the Year 2023—the first Jeep to receive this honor."
